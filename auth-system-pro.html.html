<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود | ثبت‌نام | فراموشی رمز</title>
  <!-- فونت‌های وزیرمتن و پاپینز -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== متغیرهای تم ===== */
    :root {
      --primary: #6C63FF;
      --primary-light: #8B85FF;
      --primary-dark: #4A42D6;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card-bg: rgba(255, 255, 255, 0.1);
      --card-border: rgba(255, 255, 255, 0.2);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
      --input-bg: rgba(255, 255, 255, 0.12);
      --input-border: rgba(255, 255, 255, 0.25);
      --input-focus: rgba(255, 255, 255, 0.35);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      --glow: 0 0 30px rgba(108, 99, 255, 0.5);
      --transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* تم‌های رنگی */
    [data-theme="purple"] {
      --primary: #6C63FF;
      --primary-light: #8B85FF;
      --primary-dark: #4A42D6;
      --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --glow: 0 0 30px rgba(108, 99, 255, 0.5);
    }

    [data-theme="sunset"] {
      --primary: #FF6B6B;
      --primary-light: #FF8E8E;
      --primary-dark: #E04E4E;
      --bg-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --glow: 0 0 30px rgba(255, 107, 107, 0.5);
    }

    [data-theme="ocean"] {
      --primary: #4ECDC4;
      --primary-light: #6EE7DE;
      --primary-dark: #3BA99F;
      --bg-gradient: linear-gradient(135deg, #43cea2 0%, #185a9d 100%);
      --glow: 0 0 30px rgba(78, 205, 196, 0.5);
    }

    [data-theme="midnight"] {
      --primary: #A78BFA;
      --primary-light: #C4B5FD;
      --primary-dark: #7C3AED;
      --bg-gradient: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      --glow: 0 0 30px rgba(167, 139, 250, 0.5);
    }

    [data-theme="forest"] {
      --primary: #34D399;
      --primary-light: #6EE7B7;
      --primary-dark: #059669;
      --bg-gradient: linear-gradient(135deg, #134E5E 0%, #71B280 100%);
      --glow: 0 0 30px rgba(52, 211, 153, 0.5);
    }

    [data-theme="rose"] {
      --primary: #F472B6;
      --primary-light: #F9A8D4;
      --primary-dark: #DB2777;
      --bg-gradient: linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%);
      --glow: 0 0 30px rgba(244, 114, 182, 0.5);
      --text: #4A1D3A;
      --text-muted: rgba(74, 29, 58, 0.7);
      --input-bg: rgba(255, 255, 255, 0.5);
      --input-border: rgba(74, 29, 58, 0.2);
      --input-focus: rgba(255, 255, 255, 0.7);
      --card-bg: rgba(255, 255, 255, 0.4);
      --card-border: rgba(255, 255, 255, 0.6);
    }

    /* ===== ریست و پایه ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Vazirmatn', 'Poppins', sans-serif;
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      position: relative;
      transition: background 0.6s ease;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* حباب‌های شناور پس‌زمینه */
    .bg-bubbles {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .bg-bubbles li {
      position: absolute;
      display: block;
      list-style: none;
      width: 20px;
      height: 20px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      animation: bubble 25s linear infinite;
      bottom: -150px;
    }

    .bg-bubbles li:nth-child(1) { left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
    .bg-bubbles li:nth-child(2) { left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
    .bg-bubbles li:nth-child(3) { left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
    .bg-bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
    .bg-bubbles li:nth-child(5) { left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
    .bg-bubbles li:nth-child(6) { left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
    .bg-bubbles li:nth-child(7) { left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
    .bg-bubbles li:nth-child(8) { left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
    .bg-bubbles li:nth-child(9) { left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
    .bg-bubbles li:nth-child(10) { left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

    @keyframes bubble {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 50%; }
      100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
    }

    /* ===== کنترل‌های بالای صفحه ===== */
    .top-controls {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      gap: 10px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50px;
      padding: 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .control-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      font-size: 16px;
      position: relative;
    }

    .control-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.1);
    }

    .control-btn.active {
      background: var(--primary);
      box-shadow: 0 0 15px var(--glow);
    }

    .lang-btn {
      width: auto;
      padding: 0 14px;
      border-radius: 50px;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      gap: 6px;
    }

    /* پالت رنگ */
    .theme-palette {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 0 6px;
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.3s ease;
      position: relative;
    }

    .theme-dot:hover {
      transform: scale(1.2);
    }

    .theme-dot.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.4);
      transform: scale(1.15);
    }

    .theme-dot[data-theme="purple"] { background: linear-gradient(135deg, #667eea, #764ba2); }
    .theme-dot[data-theme="sunset"] { background: linear-gradient(135deg, #f093fb, #f5576c); }
    .theme-dot[data-theme="ocean"] { background: linear-gradient(135deg, #43cea2, #185a9d); }
    .theme-dot[data-theme="midnight"] { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
    .theme-dot[data-theme="forest"] { background: linear-gradient(135deg, #134E5E, #71B280); }
    .theme-dot[data-theme="rose"] { background: linear-gradient(135deg, #ee9ca7, #ffdde1); }

    /* ===== کانتینر کارت ===== */
    .card-container {
      perspective: 1500px;
      width: 100%;
      max-width: 440px;
      z-index: 10;
      position: relative;
    }

    .card-3d {
      position: relative;
      width: 100%;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transform-style: preserve-3d;
      transition: all 0.5s ease;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
      transition: left 0.7s ease;
    }

    .card:hover::before {
      left: 100%;
    }

    /* ===== فرم‌ها ===== */
    .form-page {
      display: none;
      animation: fadeInUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .form-page.active {
      display: block;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px) rotateX(-10deg);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0);
      }
    }

    @keyframes fadeOutDown {
      from {
        opacity: 1;
        transform: translateY(0) rotateX(0);
      }
      to {
        opacity: 0;
        transform: translateY(-30px) rotateX(10deg);
      }
    }

    .form-page.exiting {
      animation: fadeOutDown 0.4s ease forwards;
    }

    /* ===== آیکون و عنوان ===== */
    .form-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: #fff;
      box-shadow: 0 10px 30px var(--glow);
      transform: rotateY(0deg);
      transition: transform 0.6s ease;
      animation: iconFloat 3s ease-in-out infinite;
    }

    @keyframes iconFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }

    .form-title {
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
      text-align: center;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
    }

    .form-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 30px;
    }

    /* ===== فیلدهای ورودی ===== */
    .input-group {
      position: relative;
      margin-bottom: 18px;
    }

    .input-group .input-icon {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 18px;
      transition: color 0.3s ease;
      pointer-events: none;
      z-index: 2;
    }

    html[dir="rtl"] .input-group .input-icon { right: 16px; }
    html[dir="ltr"] .input-group .input-icon { left: 16px; }

    .input-group input {
      width: 100%;
      padding: 16px 48px 16px 48px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 16px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
      direction: inherit;
    }

    .input-group input::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    .input-group input:focus {
      border-color: var(--primary);
      background: var(--input-focus);
      box-shadow: 0 0 0 4px var(--glow);
    }

    .input-group input:focus ~ .input-icon {
      color: var(--primary);
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      transition: color 0.3s ease;
      z-index: 3;
    }

    html[dir="rtl"] .toggle-password { left: 16px; }
    html[dir="ltr"] .toggle-password { right: 16px; }

    .toggle-password:hover { color: var(--primary); }

    /* ===== چک‌باکس و لینک‌ها ===== */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 13px;
      user-select: none;
    }

    .remember-me input {
      display: none;
    }

    .checkmark {
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--input-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      position: relative;
      flex-shrink: 0;
    }

    .remember-me input:checked + .checkmark {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 0 12px var(--glow);
    }

    .checkmark::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      opacity: 0;
      transform: scale(0);
      transition: all 0.3s ease;
    }

    .remember-me input:checked + .checkmark::after {
      opacity: 1;
      transform: scale(1);
    }

    .forgot-link {
      color: var(--primary-light);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
    }

    .forgot-link:hover {
      color: var(--text);
      text-shadow: 0 0 10px var(--glow);
    }

    /* ===== دکمه اصلی ===== */
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border: none;
      border-radius: 16px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 25px var(--glow);
      letter-spacing: 0.5px;
    }

    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.6s ease;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 35px var(--glow);
    }

    .btn-primary:hover::before {
      left: 100%;
    }

    .btn-primary:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* ===== جداکننده ===== */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--input-border);
    }

    /* ===== ورود با شبکه‌های اجتماعی ===== */
    .social-login {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 14px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .social-btn:hover {
      background: var(--input-focus);
      transform: translateY(-3px);
      border-color: var(--primary);
      box-shadow: 0 8px 20px var(--glow);
    }

    /* ===== فوتر فرم ===== */
    .form-footer {
      text-align: center;
      margin-top: 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-footer a,
    .form-footer button {
      color: var(--primary-light);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
    }

    .form-footer a:hover,
    .form-footer button:hover {
      color: var(--text);
      text-shadow: 0 0 10px var(--glow);
    }

    /* ===== دکمه بازگشت ===== */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      margin-bottom: 16px;
      padding: 6px 12px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      color: var(--text);
      background: var(--input-bg);
    }

    /* ===== پیام موفقیت ===== */
    .success-message {
      text-align: center;
      padding: 20px 0;
      animation: fadeInUp 0.5s ease;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #34D399, #059669);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      color: #fff;
      box-shadow: 0 10px 30px rgba(52, 211, 153, 0.5);
      animation: successPulse 2s ease infinite;
    }

    @keyframes successPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* ===== ریسپانسیو ===== */
    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
        border-radius: 24px;
      }

      .form-icon {
        width: 60px;
        height: 60px;
        font-size: 26px;
      }

      .form-title {
        font-size: 22px;
      }

      .top-controls {
        top: 12px;
        left: 12px;
        right: 12px;
      }

      .control-group {
        padding: 4px;
      }

      .control-btn {
        width: 32px;
        height: 32px;
        font-size: 14px;
      }

      .theme-dot {
        width: 18px;
        height: 18px;
      }

      .theme-palette {
        gap: 4px;
        padding: 0 4px;
      }
    }

    @media (max-width: 360px) {
      .card {
        padding: 24px 16px;
      }

      .form-title {
        font-size: 20px;
      }

      .input-group input {
        padding: 14px 42px 14px 42px;
        font-size: 14px;
      }
    }

    /* ===== انیمیشن ورود کارت ===== */
    .card-3d {
      animation: cardEntry 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes cardEntry {
      from {
        opacity: 0;
        transform: translateY(50px) rotateX(-15deg) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0) scale(1);
      }
    }

    /* ===== ذرات سه‌بعدی ===== */
    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
      z-index: 1;
      animation: particleFloat 8s ease-in-out infinite;
    }

    @keyframes particleFloat {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
    }

    /* ===== اسکرول‌بار ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 3px;
    }

    /* ===== حالت RTL/LTR ===== */
    html[dir="ltr"] .form-title,
    html[dir="ltr"] .form-subtitle {
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- حباب‌های پس‌زمینه -->
  <ul class="bg-bubbles">
    <li></li><li></li><li></li><li></li><li></li>
    <li></li><li></li><li></li><li></li><li></li>
  </ul>

  <!-- ذرات شناور -->
  <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 30%; animation-delay: 2s;"></div>
  <div class="particle" style="left: 50%; animation-delay: 4s;"></div>
  <div class="particle" style="left: 70%; animation-delay: 1s;"></div>
  <div class="particle" style="left: 90%; animation-delay: 3s;"></div>

  <!-- کنترل‌های بالای صفحه -->
  <div class="top-controls">
    <!-- پالت رنگ -->
    <div class="control-group">
      <div class="theme-palette">
        <div class="theme-dot active" data-theme="purple" title="Purple"></div>
        <div class="theme-dot" data-theme="sunset" title="Sunset"></div>
        <div class="theme-dot" data-theme="ocean" title="Ocean"></div>
        <div class="theme-dot" data-theme="midnight" title="Midnight"></div>
        <div class="theme-dot" data-theme="forest" title="Forest"></div>
        <div class="theme-dot" data-theme="rose" title="Rose"></div>
      </div>
    </div>

    <!-- دکمه تغییر زبان -->
    <div class="control-group">
      <button class="control-btn lang-btn" id="langToggle" onclick="toggleLanguage()">
        <span id="langIcon">🌐</span>
        <span id="langText">EN</span>
      </button>
    </div>
  </div>

  <!-- کانتینر اصلی کارت -->
  <div class="card-container">
    <div class="card-3d" id="card3d">
      <div class="card">

        <!-- ===== صفحه ورود ===== -->
        <div class="form-page active" id="loginPage">
          <div class="form-icon">🔐</div>
          <h1 class="form-title" data-fa="ورود به حساب" data-en="Welcome Back">ورود به حساب</h1>
          <p class="form-subtitle" data-fa="لطفاً وارد حساب خود شوید" data-en="Please sign in to your account">لطفاً وارد حساب خود شوید</p>

          <form onsubmit="handleLogin(event)">
            <div class="input-group">
              <input type="email" id="loginEmail" placeholder="ایمیل" data-fa-placeholder="ایمیل" data-en-placeholder="Email" required>
              <span class="input-icon">📧</span>
            </div>

            <div class="input-group">
              <input type="password" id="loginPassword" placeholder="رمز عبور" data-fa-placeholder="رمز عبور" data-en-placeholder="Password" required>
              <span class="input-icon">🔒</span>
              <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁️</button>
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span class="checkmark"></span>
                <span data-fa="مرا به خاطر بسپار" data-en="Remember me">مرا به خاطر بسپار</span>
              </label>
              <button type="button" class="forgot-link" onclick="showPage('forgotPage')" data-fa="رمز را فراموش کرده‌اید؟" data-en="Forgot password?">رمز را فراموش کرده‌اید؟</button>
            </div>

            <button type="submit" class="btn-primary" data-fa="ورود" data-en="Sign In">ورود</button>
          </form>

          <div class="divider" data-fa="یا" data-en="OR">یا</div>

          <div class="social-login">
            <button class="social-btn" title="Google" onclick="socialLogin('Google')">🔍</button>
            <button class="social-btn" title="Facebook" onclick="socialLogin('Facebook')">📘</button>
            <button class="social-btn" title="Apple" onclick="socialLogin('Apple')">🍎</button>
          </div>

          <div class="form-footer">
            <span data-fa="حساب کاربری ندارید؟" data-en="Don't have an account?">حساب کاربری ندارید؟</span>
            <button onclick="showPage('registerPage')" data-fa="ثبت‌نام کنید" data-en="Sign Up">ثبت‌نام کنید</button>
          </div>
        </div>

        <!-- ===== صفحه ثبت‌نام ===== -->
        <div class="form-page" id="registerPage">
          <button class="back-btn" onclick="showPage('loginPage')">
            <span>←</span>
            <span data-fa="بازگشت" data-en="Back">بازگشت</span>
          </button>

          <div class="form-icon">✨</div>
          <h1 class="form-title" data-fa="ایجاد حساب" data-en="Create Account">ایجاد حساب</h1>
          <p class="form-subtitle" data-fa="به ما بپیوندید و شروع کنید" data-en="Join us and get started">به ما بپیوندید و شروع کنید</p>

          <form onsubmit="handleRegister(event)">
            <div class="input-group">
              <input type="text" id="registerName" placeholder="نام کامل" data-fa-placeholder="نام کامل" data-en-placeholder="Full Name" required>
              <span class="input-icon">👤</span>
            </div>

            <div class="input-group">
              <input type="email" id="registerEmail" placeholder="ایمیل" data-fa-placeholder="ایمیل" data-en-placeholder="Email" required>
              <span class="input-icon">📧</span>
            </div>

            <div class="input-group">
              <input type="password" id="registerPassword" placeholder="رمز عبور" data-fa-placeholder="رمز عبور" data-en-placeholder="Password" required>
              <span class="input-icon">🔒</span>
              <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)">👁️</button>
            </div>

            <div class="input-group">
              <input type="password" id="registerConfirm" placeholder="تکرار رمز عبور" data-fa-placeholder="تکرار رمز عبور" data-en-placeholder="Confirm Password" required>
              <span class="input-icon">🔐</span>
              <button type="button" class="toggle-password" onclick="togglePassword('registerConfirm', this)">👁️</button>
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" id="agreeTerms" required>
                <span class="checkmark"></span>
                <span data-fa="با قوانین موافقم" data-en="I agree to terms">با قوانین موافقم</span>
              </label>
            </div>

            <button type="submit" class="btn-primary" data-fa="ثبت‌نام" data-en="Sign Up">ثبت‌نام</button>
          </form>

          <div class="divider" data-fa="یا" data-en="OR">یا</div>

          <div class="social-login">
            <button class="social-btn" title="Google" onclick="socialLogin('Google')">🔍</button>
            <button class="social-btn" title="Facebook" onclick="socialLogin('Facebook')">📘</button>
            <button class="social-btn" title="Apple" onclick="socialLogin('Apple')">🍎</button>
          </div>

          <div class="form-footer">
            <span data-fa="قبلاً ثبت‌نام کرده‌اید؟" data-en="Already have an account?">قبلاً ثبت‌نام کرده‌اید؟</span>
            <button onclick="showPage('loginPage')" data-fa="وارد شوید" data-en="Sign In">وارد شوید</button>
          </div>
        </div>

        <!-- ===== صفحه فراموشی رمز ===== -->
        <div class="form-page" id="forgotPage">
          <button class="back-btn" onclick="showPage('loginPage')">
            <span>←</span>
            <span data-fa="بازگشت" data-en="Back">بازگشت</span>
          </button>

          <div class="form-icon">🔑</div>
          <h1 class="form-title" data-fa="فراموشی رمز" data-en="Forgot Password">فراموشی رمز</h1>
          <p class="form-subtitle" data-fa="ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود" data-en="Enter your email to receive a reset link">ایمیل خود را وارد کنید تا لینک بازیابی ارسال شود</p>

          <form onsubmit="handleForgot(event)">
            <div class="input-group">
              <input type="email" id="forgotEmail" placeholder="ایمیل" data-fa-placeholder="ایمیل" data-en-placeholder="Email" required>
              <span class="input-icon">📧</span>
            </div>

            <button type="submit" class="btn-primary" data-fa="ارسال لینک بازیابی" data-en="Send Reset Link">ارسال لینک بازیابی</button>
          </form>

          <div class="form-footer" style="margin-top: 24px;">
            <span data-fa="رمز را به خاطر آوردید؟" data-en="Remember your password?">رمز را به خاطر آوردید؟</span>
            <button onclick="showPage('loginPage')" data-fa="بازگشت به ورود" data-en="Back to Login">بازگشت به ورود</button>
          </div>
        </div>

        <!-- ===== صفحه موفقیت ===== -->
        <div class="form-page" id="successPage">
          <div class="success-message">
            <div class="success-icon">✓</div>
            <h1 class="form-title" data-fa="موفق!" data-en="Success!">موفق!</h1>
            <p class="form-subtitle" id="successMessage" data-fa="ایمیل بازیابی ارسال شد" data-en="Reset link sent to your email">ایمیل بازیابی ارسال شد</p>
            <button class="btn-primary" onclick="showPage('loginPage')" style="margin-top: 20px;" data-fa="بازگشت به ورود" data-en="Back to Login">بازگشت به ورود</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    /* ===== متغیرهای سراسری ===== */
    let currentLang = 'fa';
    let currentTheme = 'purple';

    /* ===== تغییر صفحه ===== */
    function showPage(pageId) {
      const pages = document.querySelectorAll('.form-page');
      const targetPage = document.getElementById(pageId);

      pages.forEach(page => {
        if (page.classList.contains('active')) {
          page.classList.add('exiting');
          setTimeout(() => {
            page.classList.remove('active', 'exiting');
          }, 400);
        }
      });

      setTimeout(() => {
        targetPage.classList.add('active');
        // انیمیشن سه‌بعدی کارت
        const card3d = document.getElementById('card3d');
        card3d.style.transform = 'rotateY(0deg) rotateX(0deg)';
      }, 400);
    }

    /* ===== تغییر زبان ===== */
    function toggleLanguage() {
      currentLang = currentLang === 'fa' ? 'en' : 'fa';
      const html = document.documentElement;
      const langText = document.getElementById('langText');

      if (currentLang === 'fa') {
        html.setAttribute('lang', 'fa');
        html.setAttribute('dir', 'rtl');
        langText.textContent = 'EN';
      } else {
        html.setAttribute('lang', 'en');
        html.setAttribute('dir', 'ltr');
        langText.textContent = 'FA';
      }

      // ترجمه تمام المان‌ها
      document.querySelectorAll('[data-fa]').forEach(el => {
        if (el.tagName === 'INPUT') {
          el.placeholder = currentLang === 'fa' ? el.dataset.faPlaceholder : el.dataset.enPlaceholder;
        } else {
          el.textContent = currentLang === 'fa' ? el.dataset.fa : el.dataset.en;
        }
      });

      // ترجمه placeholder های input
      document.querySelectorAll('input[data-fa-placeholder]').forEach(input => {
        input.placeholder = currentLang === 'fa' ? input.dataset.faPlaceholder : input.dataset.enPlaceholder;
      });
    }

    /* ===== تغییر تم ===== */
    function setTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute('data-theme', theme);

      // بروزرسانی دکمه‌های تم
      document.querySelectorAll('.theme-dot').forEach(dot => {
        dot.classList.toggle('active', dot.dataset.theme === theme);
      });

      // ذخیره در localStorage
      localStorage.setItem('selectedTheme', theme);
    }

    // رویداد کلیک روی تم‌ها
    document.querySelectorAll('.theme-dot').forEach(dot => {
      dot.addEventListener('click', () => setTheme(dot.dataset.theme));
    });

    /* ===== نمایش/مخفی کردن رمز ===== */
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    /* ===== هندلرهای فرم ===== */
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      // انیمیشن دکمه
      const btn = e.target.querySelector('.btn-primary');
      btn.textContent = currentLang === 'fa' ? 'در حال ورود...' : 'Signing in...';
      btn.disabled = true;

      setTimeout(() => {
        btn.textContent = currentLang === 'fa' ? 'ورود' : 'Sign In';
        btn.disabled = false;
        showSuccess(currentLang === 'fa' ? 'خوش آمدید! ورود موفقیت‌آمیز بود' : 'Welcome! Login successful');
      }, 1500);
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;
      const confirm = document.getElementById('registerConfirm').value;

      if (password !== confirm) {
        alert(currentLang === 'fa' ? 'رمز عبور و تکرار آن یکسان نیستند!' : 'Passwords do not match!');
        return;
      }

      const btn = e.target.querySelector('.btn-primary');
      btn.textContent = currentLang === 'fa' ? 'در حال ثبت‌نام...' : 'Creating account...';
      btn.disabled = true;

      setTimeout(() => {
        btn.textContent = currentLang === 'fa' ? 'ثبت‌نام' : 'Sign Up';
        btn.disabled = false;
        showSuccess(currentLang === 'fa' ? 'ثبت‌نام با موفقیت انجام شد!' : 'Registration successful!');
      }, 1500);
    }

    function handleForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;

      const btn = e.target.querySelector('.btn-primary');
      btn.textContent = currentLang === 'fa' ? 'در حال ارسال...' : 'Sending...';
      btn.disabled = true;

      setTimeout(() => {
        btn.textContent = currentLang === 'fa' ? 'ارسال لینک بازیابی' : 'Send Reset Link';
        btn.disabled = false;
        showPage('successPage');
        document.getElementById('successMessage').textContent = 
          currentLang === 'fa' ? 'لینک بازیابی به ایمیل شما ارسال شد' : 'Reset link sent to your email';
      }, 1500);
    }

    function showSuccess(message) {
      showPage('successPage');
      document.getElementById('successMessage').textContent = message;
    }

    function socialLogin(provider) {
      alert(currentLang === 'fa' ? `ورود با ${provider} - به زودی!` : `Login with ${provider} - Coming soon!`);
    }

    /* ===== افکت سه‌بعدی موس ===== */
    document.addEventListener('mousemove', (e) => {
      const card = document.querySelector('.card');
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;

      const rotateX = ((y - centerY) / centerY) * -5;
      const rotateY = ((x - centerX) / centerX) * 5;

      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    document.addEventListener('mouseleave', () => {
      const card = document.querySelector('.card');
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
    });

    /* ===== بارگذاری اولیه ===== */
    window.addEventListener('DOMContentLoaded', () => {
      // بارگذاری تم ذخیره شده
      const savedTheme = localStorage.getItem('selectedTheme');
      if (savedTheme) {
        setTheme(savedTheme);
      }

      // تنظیم اولیه زبان
      if (currentLang === 'en') {
        toggleLanguage();
      }
    });

    /* ===== جلوگیری از ارسال مجدد ===== */
    document.querySelectorAll('form').forEach(form => {
      form.addEventListener('submit', (e) => {
        if (form.dataset.submitting === 'true') {
          e.preventDefault();
        }
        form.dataset.submitting = 'true';
        setTimeout(() => { form.dataset.submitting = 'false'; }, 2000);
      });
    });

    /* ===== افکت تغییر تم ===== */
    document.querySelectorAll('.theme-dot').forEach(dot => {
      dot.addEventListener('click', function() {
        // انیمیشن موج
        this.style.transform = 'scale(0.8)';
        setTimeout(() => {
          this.style.transform = '';
        }, 200);
      });
    });

    /* ===== پشتیبانی از کیبورد ===== */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        showPage('loginPage');
      }
    });
  </script>
</body>
</html>
